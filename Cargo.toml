[package]
name = "op-offline"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
thiserror = "2"
keyring = "4.0.0-rc.3"
keyring-core = "0.7"
which = "7"
foldhash = "0.1"
dirs-sys = "0.5"
url = "2.5"
urlencoding = "2.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
heed = "0.21"
globset = "0.4"
fancy-regex = "0.17"
lazy_static = "1"
humantime = "2"
subst = "0.3"
